<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Quest</title>
<meta name="theme-color" content="#0f121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{overscroll-behavior-y:none}

/* Layout: one narrow column of HUD panels, fixed bottom tab bar. Deliberately single dark theme (game screen). */
:root{
  --ink:#0f121b; --panel:#171c29; --panel2:#1f2536; --line:#2c3450;
  --text:#ebe7dc; --muted:#8d93a9; --gold:#f0b44c; --gold-dim:#8a6a33;
  --xp:#5fc3e4; --good:#6fcf8a; --bad:#e8695e;
  --pix:"Silkscreen", ui-monospace, "Courier New", monospace;
  --body:"Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.pix{font-family:var(--pix);letter-spacing:.04em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h2{font-family:var(--pix);font-weight:400;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 .r{font-family:var(--body);letter-spacing:0;text-transform:none;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.panel.notch{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.bar{height:8px;background:var(--panel2);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--xp);transition:width .4s}
.bar.gold>i{background:var(--gold)}
.bar.red>i{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:2px;background:var(--panel2);white-space:nowrap}
.chip b{font-weight:600}
.btn{padding:9px 14px;border:1px solid var(--gold-dim);color:var(--gold);border-radius:3px;font-weight:600;font-size:14px;background:transparent}
.btn.solid{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.stat-tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* status */
.status{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.rankbadge{width:64px;height:64px;display:grid;place-items:center;font-family:var(--pix);font-size:38px;border:2px solid currentColor;border-radius:4px;background:var(--panel2);line-height:1}
.status .who{min-width:0;display:flex;flex-direction:column;gap:6px}
.lvl{font-family:var(--pix);font-size:20px;line-height:1}
.title-line{font-size:13px;color:var(--muted)}
.title-line b{color:var(--gold);font-weight:600}
.meters{display:flex;flex-direction:column;gap:7px}
.meter-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* quests */
.qlist{display:flex;flex-direction:column;gap:6px}
.quest{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);text-align:left;width:100%}
.quest .box{width:26px;height:26px;border:2px solid var(--muted);border-radius:3px;display:grid;place-items:center;font-family:var(--pix);font-size:14px}
.quest .nm{min-width:0;display:flex;flex-direction:column;gap:2px}
.quest .nm span:first-child{font-weight:500}
.quest .rw{text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.quest.done{border-color:#2e4a3a;background:#18241f}
.quest.done .box{border-color:var(--good);background:var(--good);color:#0f1a13}
.quest.done .nm span:first-child{color:var(--muted);text-decoration:line-through;text-decoration-color:#5d6a62}
.quest.done .rw{color:var(--good)}
.crit{color:var(--gold);font-family:var(--pix);font-size:10px}
.tier{font-family:var(--pix);font-size:10px;padding:1px 5px;border-radius:2px;border:1px solid}
.tier.easy{color:#9ecfb0;border-color:#3b5a47}
.tier.medium{color:#7fbfe0;border-color:#2f5266}
.tier.hard{color:#f0a184;border-color:#6a3a2c}
.penalty{border-color:#6a2e2a}
.penalty h2{color:var(--bad)}
.surprise{border-color:var(--gold-dim)}
.surprise h2{color:var(--gold)}

.boss .hp{height:12px}
.boss-name{font-family:var(--pix);font-size:16px;color:var(--bad)}
.defeated{color:var(--good);font-family:var(--pix)}
.wq{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-top:1px solid var(--line)}
.wq:first-of-type{border-top:0;padding-top:0}

.scale{display:flex;gap:6px}
.scale button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:3px;background:var(--panel2);font-family:var(--pix);font-size:13px}
.scale button.on{border-color:var(--gold);color:var(--gold);background:#2a2316}
textarea,input[type=text],select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:3px;padding:9px;font:inherit}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}

.ghost{display:flex;flex-direction:column;gap:6px}
.ghost .bar{height:10px}
.ghost .bar.prev>i{background:#4b5272}

/* hero */
.hero-top{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.avatar{width:120px;height:150px;background:radial-gradient(circle at 50% 60%,var(--aura) 0%,transparent 65%);border:1px solid var(--line);border-radius:4px;display:grid;place-items:end center;padding-bottom:6px}
.avatar svg{width:96px;height:126px;image-rendering:pixelated}
.radar{max-width:280px;margin:0 auto;width:100%}
.radar svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .row{justify-content:space-between}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;font-size:14px}
.slot .k{font-family:var(--pix);font-size:11px;color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:3px;background:var(--panel2)}
.item .d{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .d small{color:var(--muted);font-size:12px}
.perk.owned{border-color:var(--gold-dim)}
.titles{display:flex;flex-wrap:wrap;gap:6px}
.titles button{padding:5px 9px;border:1px solid var(--line);border-radius:2px;font-size:13px;background:var(--panel2)}
.titles button.on{border-color:var(--gold);color:var(--gold)}
.titles button.lock{opacity:.35;cursor:default}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ach div{padding:8px;border:1px solid var(--line);border-radius:3px;font-size:12px;color:var(--muted);background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.ach div b{font-size:13px;color:var(--muted);font-weight:600}
.ach div.got{border-color:var(--gold-dim)}
.ach div.got b{color:var(--gold)}

/* shop */
.coins-big{font-family:var(--pix);font-size:26px;color:var(--gold)}
.price{font-family:var(--pix);font-size:13px;color:var(--gold)}

/* progress */
.heat{overflow-x:auto}
.heat svg{display:block}
.records{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.records div{padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;gap:2px}
.records b{font-family:var(--pix);font-size:18px;font-weight:400}
.records small{color:var(--muted);font-size:12px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#121623;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{padding:12px 0 10px;font-family:var(--pix);font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:20px;height:20px}
nav button.on{color:var(--gold)}

/* toast + fx */
.toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9;padding-inline:16px}
.toast{background:#232a3f;border:1px solid var(--gold-dim);color:var(--text);padding:8px 14px;border-radius:3px;font-size:14px;animation:tin .25s ease-out;max-width:100%}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.fx{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,10,16,.82);z-index:10;padding:24px}
.fx .card{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.fx .big{font-family:var(--pix);font-size:44px;color:var(--gold);line-height:1;text-shadow:0 0 18px rgba(240,180,76,.55)}
.fx .sub{font-family:var(--pix);font-size:14px;letter-spacing:.2em;color:var(--text)}
.fx .rays{width:220px;height:220px;position:absolute;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 10deg,rgba(240,180,76,.18) 10deg 20deg,transparent 20deg 40deg,rgba(240,180,76,.18) 40deg 50deg,transparent 50deg 70deg,rgba(240,180,76,.18) 70deg 80deg,transparent 80deg 100deg,rgba(240,180,76,.18) 100deg 110deg,transparent 110deg 130deg,rgba(240,180,76,.18) 130deg 140deg,transparent 140deg 160deg,rgba(240,180,76,.18) 160deg 170deg,transparent 170deg 190deg,rgba(240,180,76,.18) 190deg 200deg,transparent 200deg 220deg,rgba(240,180,76,.18) 220deg 230deg,transparent 230deg 250deg,rgba(240,180,76,.18) 250deg 260deg,transparent 260deg 280deg,rgba(240,180,76,.18) 280deg 290deg,transparent 290deg 310deg,rgba(240,180,76,.18) 310deg 320deg,transparent 320deg 340deg,rgba(240,180,76,.18) 340deg 350deg,transparent 350deg);animation:spin 6s linear infinite;z-index:-1}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.warn{font-size:13px;color:var(--bad);border:1px solid #6a2e2a;padding:8px 10px;border-radius:3px}
.form{display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--gold-dim);border-radius:3px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.sw{width:46px;height:26px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:left .2s}
.sw.on{background:#3a2e17;border-color:var(--gold-dim)}
.sw.on::after{left:23px;background:var(--gold)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;background:var(--panel2)}
.seg button.on{border-color:var(--gold);color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div class="toasts" id="toasts"></div>
<div id="fx"></div>

 ['Collector',c=>c.gear>=5,'Own 5 pieces of gear'],
 ['D-Rank Adventurer',c=>c.rank>=1,'Reach Rank D'],
 ['C-Rank Adventurer',c=>c.rank>=2,'Reach Rank C'],
 ['B-Rank Veteran',c=>c.rank>=3,'Reach Rank B'],
 ['A-Rank Elite',c=>c.rank>=4,'Reach Rank A'],
 ['S-Rank Legend',c=>c.rank>=5,'Reach Rank S']
];

/* ---------- dates (day starts at 4am) ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date(Date.now()-4*3600e3));
const parseKey=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const weekStart=k=>{const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)};
const wdIdx=k=>(parseKey(k).getDay()+6)%7;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function srand(s){let x=hash(s)||1;return()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
let storageOK=true;
function fresh(){const t=todayKey();return{v:1,start:t,last:t,cls:'scholar',hard:false,streakRule:.8,sound:true,xp:0,coins:0,
 statXp:{str:0,end:0,int:0,foc:0,dis:0,wis:0},quests:DEFAULT_QUESTS.map(q=>Object.assign({},q)),days:{},inv:[],
 eq:{head:null,chest:null,hand:null,outfit:null,trinket:null},perks:[],chests:0,chestsOpened:0,ach:[],titles:['Rookie'],title:'Rookie',
 bossWins:{},weeklyClaimed:{},dungeon:null,dungeonsDone:0,redemptions:[],campaignDone:{},bestStreak:0,maxLevel:1,maxRank:0,nextId:100}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){storageOK=false;return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
let S=load()||fresh();
S=Object.assign(fresh(),S);S.campaignDone=S.campaignDone||{};

function day(k){
 if(!S.days[k])S.days[k]={done:{},pen:[],mood:0,energy:0,note:'',sx:null};
 const d=S.days[k];
 if(d.sx===null){const r=srand(k+'sx');if(r()<0.45){const p=SURPRISES[Math.floor(r()*SURPRISES.length)];d.sx={name:p[0],stat:p[1],tier:'medium',done:null}}else d.sx=false}
 return d;
}

/* ---------- maths ---------- */
const levelOf=xp=>Math.floor((1+Math.sqrt(1+xp/12.5))/2);
const xpForLevel=L=>50*L*(L-1);
const rankIdx=xp=>{let i=0;RANKS.forEach((r,j)=>{if(xp>=r.min)i=j});return i};
const statLv=s=>Math.floor(Math.sqrt((S.statXp[s]||0)/25))+1;
const hasPerk=p=>S.perks.includes(p);
const spentSP=()=>S.perks.reduce((a,p)=>a+(PERKS.find(x=>x.id===p)||{cost:0}).cost,0);
const freeSP=()=>S.maxLevel-1-spentSP();
const critChance=()=>hasPerk('keen')?.08:.05;
const priceOf=p=>hasPerk('haggler')?Math.round(p*.9):p;
function bonusParts(stat){
 const parts=[];const c=CLASSES[S.cls].b[stat];if(c)parts.push(c);
 Object.values(S.eq).forEach(id=>{if(id&&ITEMS[id].stat===stat)parts.push(ITEMS[id].bonus)});
 S.perks.forEach(p=>{if(PERK_B[p]&&PERK_B[p][stat])parts.push(PERK_B[p][stat])});
 return parts.reduce((a,b)=>a+b,0);
}
function dayXp(d){if(!d)return 0;let s=0;Object.values(d.done).forEach(r=>s+=r.xp);if(d.sx&&d.sx.done)s+=d.sx.done.xp;return s}
function ratio(k){const d=S.days[k];if(!d||!S.quests.length)return 0;return S.quests.filter(q=>d.done[q.id]).length/S.quests.length}
const qualifies=k=>ratio(k)>=S.streakRule-1e-9;
function streak(){let k=todayKey(),s=qualifies(k)?1:0;k=addDays(k,-1);while(k>=S.start&&qualifies(k)){s++;k=addDays(k,-1)}return s}
function weekKeys(wk){const t=todayKey();const out=[];for(let i=0;i<7;i++){const k=addDays(wk,i);if(k<=t)out.push(k)}return out}
function weekXp(wk,uptoIdx){let s=0;for(let i=0;i<=uptoIdx;i++)s+=dayXp(S.days[addDays(wk,i)]);return s}
function ctx(){
 let total=0,perfect=0,refl=0;
 Object.keys(S.days).forEach(k=>{const d=S.days[k];total+=Object.keys(d.done).length+((d.sx&&d.sx.done)?1:0);if(ratio(k)===1)perfect++;if(d.note&&d.note.trim())refl++});
 return{total,perfect,refl,best:Math.max(S.bestStreak,streak()),level:S.maxLevel,rank:S.maxRank,bosses:Object.keys(S.bossWins).length,dungeons:S.dungeonsDone,gear:S.inv.length,redeemed:S.redemptions.length};
}

/* ---------- day rollover ---------- */
function finalize(k){
 const d=day(k);const nk=addDays(k,1);const next=day(nk);
 d.pen.filter(p=>!p.done).forEach(p=>next.pen.push({id:'p'+(S.nextId++),name:p.name,done:false}));
 const missed=S.quests.filter(q=>!d.done[q.id]);
 if(S.hard&&missed.length){
  let loss=missed.reduce((s,q)=>s+TIERS[q.tier].xp/2,0);if(hasPerk('iron'))loss/=2;loss=Math.round(loss);
  S.xp=Math.max(0,S.xp-loss);d.loss=loss;
  next.pen.push({id:'p'+(S.nextId++),name:PENALTIES[Math.floor(srand(k+'pen')()*PENALTIES.length)],done:false});
 }
 if(S.dungeon&&S.dungeon.status==='active'&&k>=S.dungeon.start&&!S.dungeon.cleared.includes(k)){S.dungeon.status='failed'}
 S.bestStreak=Math.max(S.bestStreak,streak());
}
function rollover(){
 const t=todayKey();if(S.last>=t)return false;
 let k=S.last,guard=0;while(k<t&&guard++<400){finalize(k);k=addDays(k,1)}
 S.last=t;save();return true;
}

/* ---------- fx / sound / toast ---------- */
let actx=null;
function tone(seq){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;seq.forEach(([f,at,dur])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+at);g.gain.exponentialRampToValueAtTime(.12,t0+at+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+at+dur);o.connect(g).connect(actx.destination);o.start(t0+at);o.stop(t0+at+dur+.02)})}catch(e){}}
const sndTick=()=>tone([[660,0,.08],[990,.07,.1]]);
const sndCrit=()=>tone([[880,0,.07],[1320,.06,.07],[1760,.12,.14]]);
const sndLevel=()=>tone([[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.35]]);
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),2600)}
const fxQ=[];let fxOn=false;
function queueFx(f){fxQ.push(f);if(!fxOn)nextFx()}
function nextFx(){
 const host=document.getElementById('fx');const f=fxQ.shift();if(!f){host.innerHTML='';fxOn=false;return}
 fxOn=true;sndLevel();
 let big,sub;
 if(f.type==='level'){big='LV '+f.n;sub='LEVEL UP · +1 CHEST · +1 SKILL POINT'}
 else if(f.type==='rank'){big='RANK '+RANKS[f.n].l;sub='RANK UP · NEW TITLE UNLOCKED'}
 else if(f.type==='boss'){big='VICTORY';sub=f.name.toUpperCase()+' DEFEATED'}
 else{big='CLEARED';sub=f.name.toUpperCase()}
 host.innerHTML=`<div class="fx" role="dialog" aria-label="${esc(big)}"><div class="card"><div class="rays"></div><div class="big">${esc(big)}</div><div class="sub">${esc(sub)}</div><button class="btn solid" data-a="fxNext" style="margin-top:14px">Continue</button></div></div>`;
}

/* ---------- progress checks ---------- */
function checkProgress(){
 const L=levelOf(S.xp);
 if(L>S.maxLevel){S.chests+=L-S.maxLevel;S.maxLevel=L;queueFx({type:'level',n:L})}
 const R=rankIdx(S.xp);
 if(R>S.maxRank){for(let i=S.maxRank+1;i<=R;i++)queueFx({type:'rank',n:i});S.maxRank=R}
 S.bestStreak=Math.max(S.bestStreak,streak());
 // boss
 const t=todayKey(),wk=weekStart(t);
 if(!S.bossWins[wk]&&weekXp(wk,6)>=BOSS_HP){S.bossWins[wk]=true;S.xp+=300;S.coins+=150;S.chests++;queueFx({type:'boss',name:bossName(wk)});return checkProgress()}
 const c=ctx();
 ACH.forEach(a=>{if(!S.ach.includes(a[0])&&a[3](c)){S.ach.push(a[0]);toast('Achievement: '+a[1])}});
 TITLES.forEach(tt=>{if(!S.titles.includes(tt[0])&&tt[1](c)){S.titles.push(tt[0]);toast('Title unlocked: '+tt[0])}});
 save();
}
const bossName=wk=>BOSSES[hash(wk)%BOSSES.length];

/* ---------- actions ---------- */
function award(stat,tier){
 const t=TIERS[tier];const crit=Math.random()<critChance();
 const xp=Math.round(t.xp*(1+bonusParts(stat))*(crit?2:1));
 const coins=Math.round(t.coins*(hasPerk('gold')?1.1:1));
 S.xp+=xp;S.statXp[stat]=(S.statXp[stat]||0)+xp;S.coins+=coins;
 if(crit){sndCrit();toast('Critical hit! Double XP')}else sndTick();
 return{xp,coins,crit,stat};
}
function revoke(r){S.xp=Math.max(0,S.xp-r.xp);S.statXp[r.stat]=Math.max(0,(S.statXp[r.stat]||0)-r.xp);S.coins-=r.coins}

let tab='today',armed=null,editing=null,shopTab='rewards';
const A={
 tab:b=>{tab=b.t;editing=null;window.scrollTo(0,0)},
 campToggle:b=>{S.campaignDone[b.id]=!S.campaignDone[b.id];save();},
 toggle:b=>{const d=day(todayKey());const q=S.quests.find(x=>x.id===b.id);if(!q)return;
  if(d.done[q.id]){revoke(d.done[q.id]);delete d.done[q.id]}else{d.done[q.id]=award(q.stat,q.tier)}
  checkProgress()},
 sx:()=>{const d=day(todayKey());if(!d.sx)return;if(d.sx.done){revoke(d.sx.done);d.sx.done=null}else d.sx.done=award(d.sx.stat,d.sx.tier);checkProgress()},
 pen:b=>{const d=day(todayKey());const p=d.pen.find(x=>x.id===b.id);if(p){p.done=!p.done;if(p.done)sndTick()}save()},
 mood:b=>{day(todayKey()).mood=+b.v;save()},
 energy:b=>{day(todayKey()).energy=+b.v;save()},
 claimW:b=>{const w=WEEKLY.find(x=>x.id===b.id);const wk=weekStart(todayKey());S.weeklyClaimed[wk]=S.weeklyClaimed[wk]||[];
  if(S.weeklyClaimed[wk].includes(w.id)||weeklyProgress(w)<w.target)return;S.weeklyClaimed[wk].push(w.id);S.xp+=w.xp;S.coins+=w.coins;toast('+'+w.xp+' XP, +'+w.coins+' coins');sndTick();checkProgress()},
 dStart:b=>{S.dungeon={id:b.id,start:todayKey(),cleared:[],status:'active'};toast('Entered '+DUNGEONS.find(x=>x.id===b.id).name);save()},
 dClear:()=>{const g=S.dungeon,t=todayKey();if(!g||g.status!=='active'||g.cleared.includes(t))return;g.cleared.push(t);sndTick();
  const D=DUNGEONS.find(x=>x.id===g.id);
  if(g.cleared.length>=D.floors){g.status='done';S.dungeonsDone++;S.xp+=D.xp;S.coins+=D.coins;S.chests+=D.chests;queueFx({type:'dungeon',name:D.name+' cleared'})}
  checkProgress()},
 dAbandon:()=>{if(armed!=='dAbandon'){armed='dAbandon';return 'keep'}S.dungeon=null;save()},
 dDismiss:()=>{S.dungeon=null;save()},
 buyR:b=>{const r=REWARDS.find(x=>x.id===b.id);const p=priceOf(r.price);if(S.coins<p)return;
  if(armed!=='buyR'+r.id){armed='buyR'+r.id;return 'keep'}
  S.coins-=p;S.redemptions.push({name:r.name,day:todayKey(),price:p});toast('Redeemed: '+r.name+'. Enjoy it.');sndTick();checkProgress()},
 buyG:b=>{const it=ITEMS[b.id];const p=priceOf(it.price);if(S.coins<p||S.inv.includes(b.id))return;
  if(armed!=='buyG'+b.id){armed='buyG'+b.id;return 'keep'}
  S.coins-=p;S.inv.push(b.id);if(!S.eq[it.slot])S.eq[it.slot]=b.id;toast('Bought '+it.name);sndTick();checkProgress()},
 equip:b=>{const it=ITEMS[b.id];S.eq[it.slot]=b.id;save()},
 unequip:b=>{S.eq[b.slot]=null;save()},
 chest:()=>{if(S.chests<1)return;S.chests--;S.chestsOpened++;const r=Math.random();
  const pool=Object.keys(ITEMS).filter(id=>!S.inv.includes(id)&&ITEMS[id].price<=400);
  if(r<.25&&pool.length){const id=pool[Math.floor(Math.random()*pool.length)];S.inv.push(id);if(!S.eq[ITEMS[id].slot])S.eq[ITEMS[id].slot]=id;toast('Chest: '+ITEMS[id].name+'!')}
  else{const c=20+Math.floor(Math.random()*131);S.coins+=c;toast('Chest: +'+c+' coins')}
  sndCrit();checkProgress()},
 perk:b=>{const p=PERKS.find(x=>x.id===b.id);if(hasPerk(p.id)||freeSP()<p.cost)return;S.perks.push(p.id);toast('Learned '+p.name);save()},
 title:b=>{if(S.titles.includes(b.name)){S.title=b.name;save()}},
 cls:b=>{S.cls=b.id;save()},
 hard:()=>{S.hard=!S.hard;save()},
 sound:()=>{S.sound=!S.sound;save()},
 rule:b=>{S.streakRule=+b.v;save()},
 qNew:()=>{editing='new'},
 qEdit:b=>{editing=b.id},
 qCancel:()=>{editing=null},
 qSave:()=>{const name=document.getElementById('qName').value.trim();if(!name){toast('Give the quest a name');return 'keep'}
  const v={name,stat:document.getElementById('qStat').value,tier:document.getElementById('qTier').value,slot:document.getElementById('qSlot').value};
  if(editing==='new')S.quests.push(Object.assign({id:'q'+(S.nextId++)},v));else Object.assign(S.quests.find(q=>q.id===editing),v);
  editing=null;toast('Quest saved');save()},
 qDel:b=>{if(armed!=='qDel'+b.id){armed='qDel'+b.id;return 'keep'}S.quests=S.quests.filter(q=>q.id!==b.id);editing=null;save()},
 reset:()=>{if(armed!=='reset'){armed='reset';return 'keep'}S=fresh();save();tab='today';toast('Fresh start')},
 fxNext:()=>{nextFx();return 'nofull'}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.classList.contains('lock'))return;
 const fn=A[b.dataset.a];if(!fn)return;
 const prevArmed=armed;const r=fn(b.dataset);
 if(r!=='keep')armed=null;else if(prevArmed===armed&&r==='keep'&&!armed)armed=null;
 if(r!=='nofull')render();
});
document.addEventListener('input',e=>{if(e.target.id==='note'){day(todayKey()).note=e.target.value;save();clearTimeout(window.__nt);window.__nt=setTimeout(checkProgress,1500)}});

function weeklyProgress(w){const wk=weekStart(todayKey());let n=0;weekKeys(wk).forEach(k=>{const d=S.days[k];if(!d)return;
 if(w.perfect){if(ratio(k)===1)n++;return}
 Object.values(d.done).forEach(r=>{if(r.stat===w.stat)n++});if(d.sx&&d.sx.done&&d.sx.done.stat===w.stat)n++});return n}

function radarSVG(){
 const vals=STATS.map(([s])=>statLv(s));const mx=Math.max(5,...vals);const cx=130,cy=110,R=72;
 const pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI/3;return[cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
 let g='';[.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${STATS.map((_,i)=>pt(i,f).join(',')).join(' ')}" fill="none" stroke="#2c3450" stroke-width="1"/>`});
 STATS.forEach((_,i)=>{const p=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#2c3450"/>`});
 const poly=vals.map((v,i)=>pt(i,v/mx).join(',')).join(' ');
 g+=`<polygon points="${poly}" fill="rgba(240,180,76,.25)" stroke="#f0b44c" stroke-width="2"/>`;
 vals.forEach((v,i)=>{const p=pt(i,v/mx);g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#f0b44c"/>`});
 STATS.forEach(([s,n],i)=>{const p=pt(i,1.28);g+=`<text x="${p[0]}" y="${p[1]}" fill="#8d93a9" font-size="11" text-anchor="middle" dominant-baseline="middle" font-family="Chakra Petch, sans-serif">${n} ${vals[i]}</text>`});
 return `<svg viewBox="0 0 260 220" role="img" aria-label="Stat radar">${g}</svg>`;
}

 Object.values(wks).forEach(v=>bestWeek=Math.max(bestWeek,v));
 h+=`<section class="panel"><h2>Personal records</h2><div class="records">
  <div><b class="num">${c.best}</b><small>Best streak (days)</small></div><div><b class="num">${streak()}</b><small>Current streak</small></div>
  <div><b class="num">${bestDay}</b><small>Best day XP</small></div><div><b class="num">${bestWeek}</b><small>Best week XP</small></div>
  <div><b class="num">${c.total}</b><small>Quests completed</small></div><div><b class="num">${c.perfect}</b><small>Perfect days</small></div>
  <div><b class="num">${c.bosses}</b><small>Bosses defeated</small></div><div><b class="num">${S.dungeonsDone}</b><small>Dungeons cleared</small></div>
 </div></section>`;
 // mood
 const days=[];for(let i=13;i>=0;i--)days.push(addDays(t,-i));
 const W=300,H=110,px=i=>14+i*(W-28)/13,py=v=>H-14-(v-1)*(H-28)/4;
 const line=(key,col)=>{let segs=[],cur=[];days.forEach((k,i)=>{const v=S.days[k]&&S.days[k][key];if(v){cur.push(px(i)+','+py(v))}else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
  return segs.map(s=>s.length>1?`<polyline points="${s.join(' ')}" fill="none" stroke="${col}" stroke-width="2"/>`:'').join('')+days.map((k,i)=>{const v=S.days[k]&&S.days[k][key];return v?`<circle cx="${px(i)}" cy="${py(v)}" r="3" fill="${col}"/>`:''}).join('')};
 let grid='';[1,2,3,4,5].forEach(v=>grid+=`<line x1="14" x2="${W-14}" y1="${py(v)}" y2="${py(v)}" stroke="#232a3d"/><text x="2" y="${py(v)+4}" fill="#8d93a9" font-size="9" font-family="Silkscreen, monospace">${v}</text>`);
 h+=`<section class="panel"><h2>Mood and energy <span class="r muted">Last 14 days</span></h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Mood and energy chart">${grid}${line('mood','#f0b44c')}${line('energy','#5fc3e4')}</svg>
  <div class="legend"><span><i style="background:#f0b44c"></i>Mood</span><span><i style="background:#5fc3e4"></i>Energy</span></div></section>`;
 // reflections
 const refl=Object.keys(S.days).filter(k=>S.days[k].note&&S.days[k].note.trim()).sort().reverse().slice(0,5);
 h+=`<section class="panel"><h2>Recent reflections</h2>${refl.length?refl.map(k=>`<div class="item" style="grid-template-columns:1fr"><div class="d"><small>${parseKey(k).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</small><span style="white-space:pre-wrap">${esc(S.days[k].note)}</span></div></div>`).join(''):'<span class="muted" style="font-size:13px">Your reflections from the Today tab will show here.</span>'}</section>`;
 h+=`<section class="panel"><h2>Rewards redeemed</h2>${S.redemptions.length?S.redemptions.slice().reverse().slice(0,10).map(r=>`<div class="row between" style="font-size:14px"><span>${esc(r.name)}</span><span class="muted num">${parseKey(r.day).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${r.price} c</span></div>`).join(''):'<span class="muted" style="font-size:13px">Nothing redeemed yet.</span>'}</section>`;
 return h;
}
function viewSettings(){
 let h=`<section class="panel"><h2>Quests <span class="r">${S.quests.length} daily</span></h2>`;
 const form=q=>`<div class="form"><label class="f" for="qName">Quest name<input type="text" id="qName" value="${q?esc(q.name):''}" maxlength="60" placeholder="e.g. Practise React for 30 minutes"></label>
  <div class="two"><label class="f" for="qStat">Stat<select id="qStat">${STATS.map(([s,n])=>`<option value="${s}" ${q&&q.stat===s?'selected':''}>${n}</option>`).join('')}</select></label>
  <label class="f" for="qTier">Difficulty<select id="qTier">${Object.entries(TIERS).map(([k,v])=>`<option value="${k}" ${q&&q.tier===k?'selected':''}>${v.label} (${v.xp} XP)</option>`).join('')}</select></label></div>
  <label class="f" for="qSlot">Time of day<select id="qSlot"><option value="morning" ${q&&q.slot==='morning'?'selected':''}>Morning</option><option value="evening" ${!q||q.slot!=='morning'?'selected':''}>Evening</option></select></label>
  <div class="row"><button class="btn solid small" data-a="qSave">Save quest</button><button class="btn small" data-a="qCancel">Cancel</button>${q?`<button class="btn small danger" data-a="qDel" data-id="${q.id}" style="margin-left:auto">${armed==='qDel'+q.id?'Tap again to delete':'Delete'}</button>`:''}</div></div>`;
 S.quests.forEach(q=>{h+=editing===q.id?form(q):`<div class="item"><div class="d"><span>${esc(q.name)}</span><small>${TIERS[q.tier].label} · ${SN[q.stat]} · ${q.slot==='morning'?'Morning':'Evening'}</small></div><button class="btn small" data-a="qEdit" data-id="${q.id}">Edit</button></div>`});
 h+=editing==='new'?form(null):`<button class="btn" data-a="qNew">Add a quest</button>`;
 h+=`</section>`;
 h+=`<section class="panel"><h2>Class</h2>${Object.entries(CLASSES).map(([k,c])=>`<div class="item"><div class="d"><span>${c.name}</span><small>${c.desc}</small></div>${S.cls===k?'<span class="defeated" style="font-size:11px">ACTIVE</span>':`<button class="btn small" data-a="cls" data-id="${k}">Switch</button>`}</div>`).join('')}</section>`;
 h+=`<section class="panel"><h2>Rules</h2>
  <button class="toggle" data-a="hard"><span style="text-align:left">Hard Mode<br><span class="muted" style="font-size:12px">Missed quests cost half their XP and add a penalty quest</span></span><span class="sw ${S.hard?'on':''}"></span></button>
  <button class="toggle" data-a="sound"><span>Sound effects</span><span class="sw ${S.sound?'on':''}"></span></button>
  <div style="display:flex;flex-direction:column;gap:6px"><span>Streak counts a day when you complete</span><div class="seg">${[[1,'All quests'],[.8,'80%'],[.5,'Half']].map(([v,l])=>`<button data-a="rule" data-v="${v}" class="${S.streakRule===v?'on':''}">${l}</button>`).join('')}</div></div>
  <span class="muted" style="font-size:12px">A new day starts at 4am. Progress is saved in this browser on this phone only.</span></section>`;
 h+=`<section class="panel"><h2>Danger zone</h2><button class="btn danger" data-a="reset">${armed==='reset'?'Tap again to wipe everything':'Reset all progress'}</button></section>`;
 return h;
}
function render(){
 nav();const v={today:viewToday,campaign:viewCampaign,hero:viewHero,shop:viewShop,progress:viewProgress,settings:viewSettings}[tab];
 const ta=document.activeElement&&document.activeElement.id==='note';
 document.getElementById('app').innerHTML=v();
 if(ta){const n=document.getElementById('note');if(n){n.focus();n.selectionStart=n.selectionEnd=n.value.length}}
}
rollover();day(todayKey());checkProgress();render();
setInterval(()=>{if(rollover()){checkProgress();if(tab==='today'&&!(document.activeElement&&document.activeElement.id==='note'))render()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&rollover()){checkProgress();render()}});
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
