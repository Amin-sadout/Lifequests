r:1px solid #355575;background:#13283b;color:var(--cyan);border-radius:12px;padding:10px 13px;font-weight:800;font-size:12px}.btn.primary{background:linear-gradient(100deg,#4a78f6,#45cde7);border-color:transparent;color:#06111d}.btn.gold{background:#342a18;border-color:#71572a;color:var(--gold)}.btn.ghost{background:transparent;border-color:var(--line);color:#bac9dc}.btn.danger{color:var(--red);border-color:#623044;background:#27131e}.questlist{display:grid;gap:8px}.quest{display:grid;grid-template-columns:35px minmax(0,1fr) auto;align-items:center;gap:10px;background:#0b121d;border:1px solid var(--line);border-radius:15px;padding:11px;text-align:left;width:100%;min-width:0}.quest.done{border-color:#286b5b;background:#0b201e}.check{width:31px;height:31px;border-radius:10px;border:1px solid #3a4a61;display:grid;place-items:center;color:transparent;font-weight:900}.done .check{background:#164f45;border-color:#40d8ac;color:#70f4c8}.qtext{display:grid;gap:3px;min-width:0}.qtext b{font-size:12px;font-weight:750}.qtext small{font-size:10px;color:var(--muted)}.reward{font-size:11px;color:var(--cyan);font-weight:900;white-space:nowrap}.done .qtext b{text-decoration:line-through;color:#79948e}.tag{font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #34435a;color:#9aadc7;border-radius:6px;padding:3px 6px;width:max-content}.tag.coding{color:var(--cyan);border-color:#2b6980}.tag.easy{color:var(--green)}.tag.boss{color:var(--red);border-color:#633245}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #243248;padding:11px 0}.listrow:first-of-type{border-top:0}.listrow b{font-size:12px}.listrow small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.skill{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius: min-width:0}.chartbar{align-self:end;min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(0deg,#496ef3,#61e2ff)}.toastwrap{position:fixed;inset:0;pointer-events:none}.separator{height:1px;background:var(--line);margin:3px 0}.notice{padding:11px 12px;border:1px solid #36506b;background:#0c1a29;border-radius:12px;color:#a9c3e2;font-size:11px}.hidden{display:none!important}@media(min-width:520px){.app{padding:22px 20px 35px}.hero{padding:23px}.hero h1{font-size:28px}.panel{padding:17px}}

<script>
(()=>{'use strict';
const KEY='awaken.life-rpg.v2',OLDKEY='lifequest.v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dayKey=()=>{const d=new Date(Date.now()-4*3600e3);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const weekKey=()=>{const d=new Date(Date.now()-4*3600e3);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const fmtDate=k=>{try{return new Date(k+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}catch{return k}};
const rankList=[{l:'E',min:0,c:'#8e9bb0'},{l:'D',min:600,c:'#70e6b1'},{l:'C',min:1800,c:'#66d7ff'},{l:'B',min:4200,c:'#8e9dff'},{l:'A',min:9000,c:'#c79aff'},{l:'S',min:18000,c:'#ffd477'},{l:'SS',min:35000,c:'#ff8eaa'}];
const skillDefs=[{id:'code',name:'Code Architect',icon:'⌘',stat:'int',desc:'Finish the course, build projects, ship proof.',focus:true},{id:'voice',name:'Orator',icon:'◉',stat:'com',desc:'Clear speaking, confidence, active listening.'},{id:'body',name:'Athlete',icon:'↗',stat:'str',desc:'Strength, conditioning and recovery.'},{id:'jump',name:'Skybreaker',icon:'↑',stat:'ath',desc:'Jump technique, power and measured reach.'},{id:'box',name:'Striker',icon:'✦',stat:'agi',desc:'Footwork, guard, defense and combinations.'},{id:'biz',name:'Merchant',icon:'◇',stat:'biz',desc:'Grow the anime shop with deliberate experiments.'},{id:'life',name:'Strategist',icon:'✧',stat:'dis',desc:'Planning, sleep, nutrition and consistency.'}];
const starterQuests=[{id:'code50',title:'Deep work: coding',desc:'50 focused minutes on your current course.',skill:'code',xp:70,coins:18,diff:'CORE',kind:'coding'},{id:'codeproof',title:'Create one proof of progress',desc:'Finish a lesson, solve an exercise or commit a small project.',skill:'code',xp:45,coins:12,diff:'CORE',kind:'coding'},{id:'speak10',title:'Speaking reps',desc:'10 minutes of reading aloud, recording or structured practice.',skill:'voice',xp:35,coins:10,diff:'STANDARD'},{id:'move',title:'Train or recover deliberately',desc:'Complete a suitable session or planned recovery.',skill:'body',xp:35,coins:10,diff:'STANDARD'},{id:'bizone',title:'One anime shop growth action',desc:'Listing, product research, customer service or content.',skill:'biz',xp:40,coins:12,diff:'STANDARD'},{id:'plan',title:'Plan tomorrow',desc:'Choose the first coding task and three priorities.',skill:'life',xp:20,coins:6,diff:'EASY'}];
function fresh(){return {v:2,created:dayKey(),profile:{name:'Awakened',age:'30+',height:179,weight:110,notes:'Beginner training; building back boxing fundamentals; coding course in progress; anime shop already making sales.'},xp:0,coins:0,level:1,rank:'E',quests:starterQuests.map(x=>({...x})),days:{},skills:Object.fromEntries(skillDefs.map(s=>[s.id,{xp:0,level:1,proof:[],notes:''}])),class:{primary:'Unawakened',secondary:[],evolution:0},bosses:{},inventory:[{id:'starter_core',name:'Dormant Core',rarity:'Common',slot:'core',effect:'Your journey begins here.'}],equipped:'starter_core',achievements:[],story:{chapter:1,completed:[]},season:{number:1,start:dayKey(),xp:0},settings:{difficulty:'balanced',dailyTarget:3,notifications:false},history:[],shop:{},legacy:null,metrics:[],reflections:[]}}
function migrateOld(o){const n=fresh();n.legacy=JSON.parse(JSON.stringify(o));n.xp=Number(o.xp)||0;n.coins=Number(o.coins)||0;n.profile={...n.profile,name:o.profile?.name||o.name||'Awakened',age:'30+',height:179,weight:110,notes:n.profile.notes};n.quests=Array.isArray(o.quests)&&o.quests.length?o.quests.map(q=>({id:String(q.id),title:q.name||q.title||'Legacy quest',desc:`Migrated from your old app · ${q.slot||'daily'} · ${q.tier||'standard'}`,skill:({int:'code',foc:'code',wis:'life',str:'body',end:'body',dis:'life'}[q.stat]||'life'),xp:({easy:10,medium:25,hard:40}[q.tier]||25),coins:({easy:5,medium:10,hard:20}[q.tier]||10),diff:(q.tier||'STANDARD').toUpperCase(),kind:'legacy',legacyStat:q.stat,legacy:true})):n.quests;
if(o.statXp)n.legacyStats={...o.statXp};if(o.days&&typeof o.days==='object'){n.days={};for(const [date,d] of Object.entries(o.days)){const done={};for(const [id,r] of Object.entries(d.done||{})){done[id]={done:true,xp:r.xp||0,coins:r.coins||0,skill:({int:'code',foc:'code',wis:'life',str:'body',end:'body',dis:'life'}[r.stat]||'life'),legacy:true}}n.days[date]={done,note:d.note||'',mood:d.mood||0,energy:d.energy||0,pen:d.pen||[],legacySurprise:d.sx||null};if(d.note)n.reflections.push({date,text:d.note})}}
const statMap={int:'code',foc:'code',wis:'life',str:'body',end:'body',dis:'life'};for(const [stat,xp] of Object.entries(o.statXp||{})){const id=statMap[stat];if(id)n.skills[id].xp+=Number(xp)||0}n.inventory=(o.inv||[]).map(id=>({id,name:id.replace(/_/g,' '),rarity:'Legacy',slot:'legacy',effect:'Preserved from the previous app.'}));n.equipped=o.eq||{};n.achievements=[...(o.ach||[])].map(x=>typeof x==='string'?x:JSON.stringify(x));n.legacyMeta={cls:o.cls,hard:o.hard,streakRule:o.streakRule,sound:o.sound,perks:o.perks||[],titles:o.titles||[],title:o.title,eq:o.eq||{},inv:o.inv||[],redemptions:o.redemptions||[],bossWins:o.bossWins||{},weeklyClaimed:o.weeklyClaimed||{},dungeon:o.dungeon||null,dungeonsDone:o.dungeonsDone||0,maxLevel:o.maxLevel||1,maxRank:o.maxRank||0,bestStreak:o.bestStreak||0};n.history=Object.entries(n.days).map(([date,d])=>({date,completed:Object.keys(d.done).length,note:d.note||'',legacy:true}));n.coins=Number(o.coins)||0;n.settings={...n.settings,difficulty:o.hard?'hard':'balanced'};n.season.xp=n.xp;n.importedFrom='lifequest.v1';return n}
let S=null,tab='home',questFilter='all',toastTimer=null,editingQuest=null;function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch{}try{const old=localStorage.getItem(OLDKEY);if(old){const migrated=migrateOld(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(migrated));return migrated}}catch{}return fresh()}S=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){console.warn(e)}}function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2200)}function today(){if(!S.days[dayKey()])S.days[dayKey()]={done:{},note:'',mood:0,energy:0};return S.days[dayKey()]}
function level(){return Math.floor((1+Math.sqrt(1+S.xp/40))/2)}function xpAt(l){return 20*l*(l-1)}function rank(){let r=rankList[0];for(const x of rankList)if(S.xp>=x.min)r=x;return r}function rankIndex(){return rankList.findIndex(x=>x.l===rank().l)}function completedToday(){return Object.values(today().done).filter(x=>x.done).length}function todayXp(){return Object.values(today().done).reduce((a,x)=>a+(x.done?x.xp||0:0),0)}function skillXp(id){return S.skills[id]?.xp||0}function skillLevel(id){return Math.floor(Math.sqrt(skillXp(id)/100))+1}function skillPct(id){const l=skillLevel(id),xp=skillXp(id),lo=100*(l-1)*(l-1),hi=100*l*l;return Math.max(0,Math.min(100,(xp-lo)/(hi-lo)*100))}function weeklyDone(){const now=new Date(),m=new Date(now);m.setDate(now.getDate()-((now.getDay()+6)%7));const start=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0');return Object.entries(S.days).filter(([k])=>k>=start).reduce((n,[,d])=>n+Object.values(d.done||{}).filter(x=>x.done).length,0)}function streak(){let n=0,d=new Date();for(let i=0;i<365;i++){const k=new Date(d.getTime()-i*86400000-4*3600000).toISOString().slice(0,10);if(S.days[k]&&Object.values(S.days[k].done||{}).some(x=>x.done))n++;else if(i>0)break}return n}
function className(){const order=[['code','Scholar'],['voice','Orator'],['body','Vanguard'],['jump','Skybreaker'],['box','Striker'],['biz','Merchant'],['life','Strategist']];const ranked=order.map(([id,name])=>({id,name,xp:skillXp(id)})).sort((a,b)=>b.xp-a.xp);const lead=ranked[0];const old=S.class.primary;if(lead.xp>=100&&lead.name!==old){S.class.primary=lead.name;S.class.evolution=Math.max(S.class.evolution||0,Math.floor(lead.xp/500));}return S.class.primary||'Unawakened'}function rankGate(){const l=level(),bossCount=Object.values(S.bosses).filter(b=>b.done).length;const gates=[{l:'E',level:1,proof:0,boss:0},{l:'D',level:5,proof:1,boss:0},{l:'C',level:10,proof:3,boss:1},{l:'B',level:18,proof:6,boss:2},{l:'A',level:28,proof:10,boss:4},{l:'S',level:40,proof:15,boss:7},{l:'SS',level:55,proof:25,boss:12}];let out=gates[0];for(const g of gates){const proof=S.metrics.length+skillDefs.reduce((n,s)=>n+(S.skills[s.id].proof||[]).length,0);if(l>=g.level&&proof>=g.proof&&bossCount>=g.boss)out=g}return out}
function award(q){const d=today(),r=d.done[q.id];if(r?.done){d.done[q.id]={...r,done:false};S.xp=Math.max(0,S.xp-(r.xp||q.xp));S.coins=Math.max(0,S.coins-(r.coins||q.coins));S.skills[q.skill].xp=Math.max(0,S.skills[q.skill].xp-(r.xp||q.xp));S.season.xp=Math.max(0,S.season.xp-(r.xp||q.xp));toast('Quest unchecked')}else{const xp=q.xp||25,coins=q.coins||5;d.done[q.id]={done:true,xp,coins,skill:q.skill};S.xp+=xp;S.coins+=coins;S.skills[q.skill]=S.skills[q.skill]||{xp:0,level:1,proof:[],notes:''};S.skills[q.skill].xp+=xp;S.season.xp+=xp;S.history.push({date:dayKey(),quest:q.title,xp,skill:q.skill});toast('+'+xp+' XP · '+q.title);checkMilestones()}S.level=level();S.rank=rank().l;save();render()}
function checkMilestones(){const l=level();if(l>S.level){S.inventory.push({id:'level-'+l,name:'Level '+l+' Cache',rarity:'Uncommon',slot:'cache',effect:'Milestone keepsake'});toast('LEVEL UP · '+l)}const all=Object.values(today().done).filter(x=>x.done).length;if(all>=S.settings.dailyTarget&&!today().dailyBonus){today().dailyBonus=true;S.xp+=50;S.coins+=20;S.season.xp+=50;toast('Daily target cleared · bonus +50 XP')}}
function addQuest(){const title=$('#newQuestTitle')?.value.trim();if(!title)return toast('Enter a quest name');const skill=$('#newQuestSkill')?.value||'code';const xp=Math.max(5,Math.min(500,Number($('#newQuestXP')?.value)||25));S.quests.push({id:'custom-'+Date.now(),title,desc:'Custom quest',skill,xp,coins:Math.round(xp/4),diff:'CUSTOM',kind:'custom'});save();render();toast('Quest added')}
function createBoss(){const id=weekKey();if(S.bosses[id])return toast('Today’s boss already exists');S.bosses[id]={title:'The Procrastination Warden',desc:'Complete a 50-minute coding block and ship one visible result.',target:2,progress:0,reward:180,coins:50,done:false};save();render()}
function bossProgress(){const b=S.bosses[weekKey()];if(!b||b.done)return toast('No active boss to progress');b.progress=Math.min(b.target,b.progress+1);if(b.progress>=b.target){b.done=true;S.xp+=b.reward;S.coins+=b.coins;S.season.xp+=b.reward;S.history.push({date:dayKey(),quest:'Boss defeated: '+b.title,xp:b.reward,skill:'code'});toast('BOSS DEFEATED · +'+b.reward+' XP')}else toast('Boss progress +1');save();render()}
function metricAdd(){const type=$('#metricType')?.value||'bodyweight',val=Number($('#metricValue')?.value),note=$('#metricNote')?.value||'';if(!Number.isFinite(val)||!$('#metricValue')?.value)return toast('Enter a measurement');S.metrics.push({date:dayKey(),type,value:val,note});save();render();toast('Measurement recorded')}
function proofAdd(id){const input=$('#proof-'+id);const text=input?.value.trim();if(!text)return toast('Add a short proof note');S.skills[id].proof.push({date:dayKey(),text});S.history.push({date:dayKey(),quest:'Skill proof: '+text,xp:0,skill:id});save();render();toast('Proof recorded')}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='awaken-life-rpg-backup-'+dayKey()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')}
function importFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);if(raw.v===1||raw.quests?.some(q=>q.name&&!q.title)){if(!confirm('Legacy save detected. Import and migrate its data into AWAKEN?'))return;const n=migrateOld(raw);S={...n,...{profile:{...S.profile,...n.profile}}}}else if(raw.v===2&&raw.skills&&raw.days){if(!confirm('Replace current AWAKEN save with this backup?'))return;S=raw}else{alert('This file does not look like a supported Life RPG backup.');return}save();render();toast('Save imported successfully')}catch(e){alert('Could not read this save file.')}};reader.readAsText(file)}
function nav(){const items=[['home','⌂','Home'],['quests','☷','Quests'],['skills','⌘','Skills'],['progress','▥','Progress'],['system','◈','System']];$('#tabs').innerHTML=items.map(([id,icon,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}"><span>${icon}</span>${label}</button>`).join('')}
function statusHero(){const l=level(),lo=xpAt(l),hi=xpAt(l+1),gate=rankGate(),rk=rankList.find(x=>x.l===gate.l)||rank(),done=completedToday();return `<section class="hero"><div class="heroTop"><div><div class="eyebrow">System online · ${fmtDate(dayKey())}</div><h1>${esc(S.profile.name||'Awakened')}</h1><div class="sub">${esc(className())} · ${S.class.evolution||0} evolutions · ${S.season.number}ᵗʰ season</div></div><div class="rank">${rk.l}</div></div><div class="row between"><span class="level">LEVEL ${l}</span><span class="sub">${S.xp.toLocaleString()} total XP</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,(S.xp-lo)/(hi-lo)*100))}%"></i></div><div class="meterlabel"><span>${S.xp-lo} XP in this level</span><span>${hi-S.xp} XP to next</span></div><div class="metrics"><div class="metric"><b>${S.coins.toLocaleString()}</b><span>Credits</span></div><div class="metric"><b>${done}/${S.settings.dailyTarget}</b><span>Daily targets</span></div><div class="metric"><b>${weeklyDone()}</b><span>Weekly actions</span></div></div><div class="row between"><span class="tag">Rank gate: ${gate.l}</span><span class="small muted">Rank needs level + proof + bosses</span></div></section>`}
function home(){const done=today().done||{},qs=S.quests.filter(q=>!done[q.id]?.done).sort((a,b)=>(a.skill==='code'?-1:0)-(b.skill==='code'?-1:0));const boss=S.bosses[weekKey()];const next=skillDefs.find(x=>x.id==='code');return `${statusHero()}<div class="sectiontitle"><h2>Mission briefing</h2><span class="tag coding">CODING PRIORITY</span></div><section class="panel"><div class="row between"><div><div class="eyebrow">Main campaign · Chapter ${S.story.chapter}</div><h2 style="font-size:16px;color:var(--text);letter-spacing:0;text-transform:none;margin-top:4px">Become a Builder</h2><div class="sub">Finish your course. Ship proof. Build confidence.</div></div><span style="font-size:25px">⌘</span></div><div class="bar"><i style="width:${Math.min(100,skillPct('code'))}%"></i></div><div class="meterlabel"><span>Code Architect · Lv ${skillLevel('code')}</span><span>${skillXp('code')} skill XP</span></div><div class="notice">Suggested daily win: one 50-minute coding block, one concrete result, and 10 minutes of speaking practice.</div></section>${boss?`<section class="panel"><div class="sectiontitle"><h2>Active boss</h2><span class="tag boss">${boss.done?'DEFEATED':'ENCOUNTER'}</span></div><b>${esc(boss.title)}</b><div class="sub">${esc(boss.desc)}</div><div class="bar"><i style="width:${boss.progress/boss.target*100}%"></i></div><div class="meterlabel"><span>${boss.progress}/${boss.target} objectives</span><span>+${boss.reward} XP</span></div><button class="btn ${boss.done?'ghost':'primary'}" data-act="bossProgress" ${boss.done?'disabled':''}>${boss.done?'Boss defeated':'Progress boss objective'}</button></section>`:`<section class="panel"><div class="sectiontitle"><h2>Weekly boss</h2><span class="tag boss">READY</span></div><b>The Procrastination Warden</b><div class="sub">Defeat avoidance by finishing a deep-work block and shipping a visible result.</div><button class="btn primary" data-act="bossCreate">Accept boss challenge</button></section>`}<div class="sectiontitle"><h2>Active missions</h2><button class="btn ghost" data-tab="quests">All quests</button></div><div class="questlist">${qs.slice(0,4).map(q=>questCard(q)).join('')||'<div class="empty">All active missions cleared. Add a bonus quest or recover with intention.</div>'}</div><div class="sectiontitle"><h2>Quick access</h2><span class="small muted">System modules</span></div><div class="grid2"><button class="quick" data-tab="skills"><span class="qicon">⌘</span><b>Skill trees</b><small>Build your class</small></button><button class="quick" data-tab="progress"><span class="qicon">▥</span><b>Analytics</b><small>See real progress</small></button><button class="quick" data-tab="system" data-jump="shop"><span class="qicon">◇</span><b>Inventory & shop</b><small>Spend earned credits</small></button><button class="quick" data-tab="system" data-jump="story"><span class="qicon">✧</span><b>Story & seasons</b><small>Long-term campaign</small></button></div>`}
function questCard(q){const r=today().done[q.id],done=!!r?.done;return `<button class="quest ${done?'done':''}" data-act="quest" data-id="${esc(q.id)}"><span class="check">✓</span><span class="qtext"><b>${esc(q.title)}</b><small>${esc(q.desc||'Daily mission')} · ${esc(skillDefs.find(s=>s.id===q.skill)?.name||q.skill||'General')}</small><span class="tag ${q.kind==='coding'?'coding':q.diff==='EASY'?'easy':''}">${esc(q.diff||'STANDARD')}</span></span><span class="reward">${done?'✓':`+${q.xp} XP`}<br><span class="muted">${done?'DONE':`+${q.coins} cr`}</span></span></button>`}
function quests(){const done=today().done;const list=S.quests.filter(q=>questFilter==='all'||(questFilter==='open'&&!done[q.id]?.done)||(questFilter==='done'&&done[q.id]?.done)||(questFilter==='code'&&q.skill==='code'));return `${statusHero()}<section class="panel"><div class="sectiontitle"><h2>Quest board</h2><span class="tag">${list.length} MISSIONS</span></div><div class="row">${[['all','All'],['open','Open'],['done','Cleared'],['code','Coding']].map(([id,l])=>`<button class="btn ${questFilter===id?'primary':'ghost'}" data-filter="${id}">${l}</button>`).join('')}</div><div class="questlist">${list.map(q=>questCard(q)).join('')||'<div class="empty">No quests in this filter.</div>'}</div><div class="separator"></div><div class="sectiontitle"><h2>Create mission</h2><span class="small muted">Custom XP</span></div><div class="formgrid"><label class="field">Mission name<input id="newQuestTitle" placeholder="e.g. Complete React lesson 4"></label><label class="field">Skill tree<select id="newQuestSkill">${skillDefs.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><label class="field">Reward XP<input id="newQuestXP" type="number" min="5" max="500" value="30"></label><button class="btn primary" data-act="addQuest">+ Add quest</button></div></section>`}
function skills(){const lead=className();return `${statusHero()}<section class="panel"><div class="sectiontitle"><h2>Adaptive class</h2><span class="tag">EVOLVING</span></div><div class="row"><div class="rank">${lead.slice(0,1)}</div><div><b style="font-size:18px">${esc(lead)}</b><div class="sub">Class evolves toward the skill tree you train most.</div></div></div><div class="notice">Current evolution tier: ${S.class.evolution||0}. Your dominant practice shapes your class; the other trees remain available as secondary paths.</div></section><section class="panel"><div class="sectiontitle"><h2>Skill trees</h2><span class="small muted">XP is tracked separately</span></div>${skillDefs.map(s=>{const l=skillLevel(s.id),xp=skillXp(s.id);return `<div class="skill"><div class="skillicon">${s.icon}</div><div><b>${s.name}</b><small>${s.desc}</small><div class="bar"><i style="width:${skillPct(s.id)}%"></i></div><small>Lv ${l} · ${xp} XP · ${S.skills[s.id].proof?.length||0} proofs</small></div><span class="tag ${s.focus?'coding':''}">${s.id===S.class.primary?'MAIN':s.focus?'FOCUS':'PATH'}</span></div><div class="listrow"><div><b>Log a milestone / proof</b><small>Project, recording, workout record, sales experiment, or technique milestone.</small></div></div><label class="field">Proof note<input id="proof-${s.id}" placeholder="What did you actually complete?"></label><button class="btn ghost" data-act="proof" data-id="${s.id}">Record proof</button>`}).join('')}</section><section class="panel"><h2>Rank ladder <span class="small muted">Hybrid progression</span></h2>${rankList.map((r,i)=>{const gate=[1,5,10,18,28,40,55][i],proof=[0,1,3,6,10,15,25][i],boss=[0,0,1,2,4,7,12][i],active=rankGate().l===r.l;return `<div class="rankrow"><span class="rankletter" style="color:${r.c}">${r.l}</span><div><b>${r.l}-Rank ${i===0?'Awakened':'Hunter'}</b><div class="sub">Level ${gate}+ · ${proof} proofs · ${boss} boss clears</div></div><span class="tag">${active?'CURRENT':level()>=gate?'PROOF GATE':'LOCKED'}</span></div>`}).join('')}</section>`}
function progress(){const days=Array.from({length:7},(_,i)=>{const d=new Date(Date.now()-(6-i)*86400000-4*3600000),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return {k,n:Object.values(S.days[k]?.done||{}).filter(x=>x.done).length,xp:Object.values(S.days[k]?.done||{}).reduce((a,x)=>a+(x.done?x.xp||0:0),0)}});const max=Math.max(1,...days.map(d=>d.xp));return `${statusHero()}<section class="panel"><div class="sectiontitle"><h2>7-day activity</h2><span class="tag">LOCAL ANALYTICS</span></div><div class="chart">${days.map(d=>`<div class="chartcol"><div class="chartbar" style="height:${Math.max(3,d.xp/max*100)}%" title="${d.xp} XP"></div><span>${d.k.slice(8)}</span></div>`).join('')}</div><div class="metrics"><div class="metric"><b>${S.xp.toLocaleString()}</b><span>Total XP</span></div><div class="metric"><b>${S.history.length}</b><span>Events</span></div><div class="metric"><b>${S.metrics.length}</b><span>Measurements</span></div></div></section><section class="panel"><div class="sectiontitle"><h2>Real-world measurements</h2><span class="small muted">Evidence, not XP</span></div><div class="formgrid"><label class="field">Measurement<select id="metricType"><option value="bodyweight">Body weight (kg)</option><option value="vertical">Vertical jump (cm)</option><option value="coding">Course completion (%)</option><option value="speaking">Speaking practice (minutes)</option><option value="shop">Shop sales / orders</option><option value="strength">Strength / reps</option><option value="boxing">Boxing rounds</option></select></label><label class="field">Value<input id="metricValue" type="number" step="any" placeholder="Enter measurement"></label><label class="field">Context (optional)<input id="metricNote" placeholder="Test conditions or notes"></label><button class="btn primary" data-act="metricAdd">Record measurement</button></div>${S.metrics.length?S.metrics.slice().reverse().slice(0,10).map(m=>`<div class="listrow"><div><b>${esc(m.type)} · ${m.value}</b><small>${fmtDate(m.date)} ${esc(m.note||'')}</small></div></div>`).join(''):'<div class="empty">Log a baseline to start seeing real-world change.</div>'}</section><section class="panel"><h2>Recent activity</h2>${S.history.length?S.history.slice().reverse().slice(0,15).map(h=>`<div class="listrow"><div><b>${esc(h.quest)}</b><small>${fmtDate(h.date)} · ${esc(h.skill||'system')}</small></div><span class="reward">+${h.xp||0} XP</span></div>`).join(''):'<div class="empty">Your cleared quests and milestones will appear here.</div>'}</section><section class="panel"><h2>Reflections</h2><label class="field">Today's reflection<textarea id="reflection" placeholder="What worked? What got in the way? What is tomorrow's first coding task?">${esc(today().note||'')}</textarea></label><button class="btn ghost" data-act="saveReflection">Save reflection</button>${S.reflections.slice().reverse().slice(0,5).map(r=>`<div class="listrow"><div><b>${fmtDate(r.date)}</b><small>${esc(r.text)}</small></div></div>`).join('')}</section>`}
function system(){const owned=S.inventory||[];const jump=location.hash.slice(1);return `${statusHero()}<section class="panel" id="shop"><div class="sectiontitle"><h2>Guild shop</h2><span class="tag">${S.coins} CREDITS</span></div><div class="sub">Spend credits on real-life rewards or save for future equipment. Real rewards are self-honoured.</div>${[{name:'Small treat',cost:50,desc:'A small planned reward.'},{name:'One hour of guilt-free gaming',cost:100,desc:'Enjoy it after your priority work.'},{name:'Anime / hobby budget',cost:250,desc:'A deliberate hobby purchase.'},{name:'Premium reward',cost:500,desc:'Choose a meaningful reward.'}].map((r,i)=>`<div class="listrow"><div><b>${r.name}</b><small>${r.desc}</small></div><button class="btn ${S.coins>=r.cost?'gold':'ghost'}" data-act="redeem" data-cost="${r.cost}" data-name="${r.name}" ${S.coins<r.cost?'disabled':''}>${r.cost} cr</button></div>`).join('')}</section><section class="panel" id="inventory"><div class="sectiontitle"><h2>Inventory</h2><span class="tag">${owned.length} ITEMS</span></div>${owned.map(it=>`<div class="listrow"><div><b>${esc(it.name)}</b><small>${esc(it.rarity||'Common')} · ${esc(it.effect||it.slot||'keepsake')}</small></div><span class="tag">${it.id===S.equipped?'EQUIPPED':'OWNED'}</span></div>`).join('')||'<div class="empty">No items yet.</div>'}</section><section class="panel" id="story"><div class="sectiontitle"><h2>Campaign & seasons</h2><span class="tag">CHAPTER ${S.story.chapter}</span></div><b>The Builder’s Path</b><div class="sub">Chapter 1 — Awakening: establish your coding rhythm and ship a visible project.</div><div class="listrow"><div><b>Chapter objective</b><small>Complete 10 coding missions and record 1 proof of work.</small></div><span class="tag">${S.skills.code.proof.length}/1 PROOFS</span></div><div class="bar"><i style="width:${Math.min(100,S.quests.filter(q=>q.skill==='code').reduce((n,q)=>n+(today().done[q.id]?.done?1:0),0)*10)}%"></i></div><div class="separator"></div><div class="row between"><div><b>Season ${S.season.number}</b><div class="sub">Started ${fmtDate(S.season.start)} · ${S.season.xp} seasonal XP</div></div><button class="btn ghost" data-act="season">Start new season</button></div><div class="notice">Starting a new season archives its summary; it will not delete your lifetime XP, skill levels, quests or history.</div></section><section class="panel"><div class="sectiontitle"><h2>System advisor</h2><span class="tag">LOCAL COACH</span></div><div class="notice">${esc(coach())}</div><button class="btn ghost" data-act="coach">Refresh recommendation</button></section><section class="panel"><h2>Profile & preferences</h2><div class="formgrid"><label class="field">Character name<input id="profileName" maxlength="40" value="${esc(S.profile.name)}"></label><label class="field">Age range<input id="profileAge" value="${esc(S.profile.age||'')}" maxlength="20"></label><label class="field">Height (cm)<input id="profileHeight" type="number" value="${Number(S.profile.height)||179}"></label><label class="field">Weight (kg)<input id="profileWeight" type="number" step="0.1" value="${Number(S.profile.weight)||110}"></label><label class="field">Daily target<input id="dailyTarget" type="number" min="1" max="12" value="${S.settings.dailyTarget}"></label><label class="field">Difficulty<select id="difficulty"><option value="balanced" ${S.settings.difficulty==='balanced'?'selected':''}>Balanced</option><option value="relaxed" ${S.settings.difficulty==='relaxed'?'selected':''}>Relaxed</option><option value="hardcore" ${S.settings.difficulty==='hardcore'?'selected':''}>Hardcore</option></select></label><button class="btn primary" data-act="saveSettings">Save preferences</button></div></section><section class="panel"><h2>Save data & migration</h2><div class="notice">Your progress is saved locally in this browser. Export backups regularly. Legacy data may auto-migrate when the old save is accessible, and a full old save can be imported below.</div><div class="row"><button class="btn primary" data-act="export">Export backup</button><label class="btn ghost" for="importFile">Import backup</label><input id="importFile" class="hidden" type="file" accept="application/json,.json"></div>${S.legacy?'<div class="notice">Legacy archive preserved in this save. Old history, settings, equipment and source data remain available in the backup.</div>':''}<button class="btn danger" data-act="reset">Reset current save</button></section>`}
function coach(){const code=skillXp('code'),proof=S.skills.code.proof.length,done=completedToday();if(done===0)return 'Start small: begin one 25-minute coding block, then extend it if focus is good. The first action matters more than the perfect plan.';if(code<200)return 'Build consistency before intensity. Finish the current course module and leave a visible artifact: an exercise, note, or tiny project.';if(proof===0)return 'You have activity but no recorded proof yet. Ship one small project or save a completed exercise as evidence.';if(S.skills.voice.xp<100)return 'Keep coding as the main campaign, but add 10 minutes of speaking practice to strengthen communication without derailing deep work.';return 'Maintain your coding streak, turn learning into projects, and review your weekly measurements. Raise difficulty only when the current plan feels sustainable.'}
function render(){nav();const views={home,quests,skills,progress,system};$('#app').innerHTML=`<header class="top"><div><div class="brand">◈ AWAKEN</div><div class="eyebrow">Life progression system</div></div><div class="topright"><span class="pill">◈ ${S.coins} CR</span><button class="iconbtn" data-tab="system" aria-label="System settings">⚙</button></div></header>${(views[tab]||home)()}`;if(tab==='system'&&location.hash)setTimeout(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;location.hash='';render();return}const f=e.target.closest('[data-filter]');if(f){questFilter=f.dataset.filter;render();return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;switch(a){case'quest':{const q=S.quests.find(x=>x.id===b.dataset.id);if(q)award(q);break}case'addQuest':addQuest();break;case'bossCreate':createBoss();break;case'bossProgress':bossProgress();break;case'metricAdd':metricAdd();break;case'proof':proofAdd(b.dataset.id);break;case'saveReflection':{const text=$('#reflection')?.value.trim()||'';today().note=text;if(text)S.reflections.push({date:dayKey(),text});save();render();toast('Reflection saved');break}case'redeem':{const cost=Number(b.dataset.cost);if(S.coins<cost)return;if(!confirm(`Redeem ${cost} credits for ${b.dataset.name}?`))return;S.coins-=cost;(S.shop.redemptions||(S.shop.redemptions=[])).push({date:dayKey(),name:b.dataset.name,cost});save();render();toast('Reward redeemed');break}case'season':if(!confirm('Start a new season? Lifetime progress will be kept.'))return;S.history.push({date:dayKey(),quest:`Season ${S.season.number} archived at ${S.season.xp} XP`,xp:0,skill:'season'});S.season={number:S.season.number+1,start:dayKey(),xp:0};save();render();toast('New season started');break;case'coach':toast(coach());break;case'saveSettings':S.profile.name=$('#profileName').value.trim()||'Awakened';S.profile.age=$('#profileAge').value.trim();S.profile.height=Number($('#profileHeight').value)||179;S.profile.weight=Number($('#profileWeight').value)||110;S.settings.dailyTarget=Math.max(1,Math.min(12,Number($('#dailyTarget').value)||3));S.settings.difficulty=$('#difficulty').value;save();render();toast('Preferences saved');break;case'export':exportData();break;case'reset':if(!confirm('Reset AWAKEN save? Export a backup first if you want to keep this progress.'))return;S=fresh();save();tab='home';render();toast('New journey started');break;}});
document.addEventListener('change',e=>{if(e.target.id==='importFile')importFile(e.target.files?.[0])});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newQuestTitle'){addQuest()}});document.addEventListener('input',e=>{if(e.target.id==='reflection'){today().note=e.target.value;save()}});
// Recover if the old and new app share browser storage; preserve the untouched old object in the v2 archive.
if(S.importedFrom==='lifequest.v1')toast('Legacy save migrated · archive preserved');if(!S.days[dayKey()]){S.days[dayKey()]={done:{},note:'',mood:0,energy:0};save()}render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
